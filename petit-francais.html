<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petit Français</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* Layout: one-screen toddler app over a living meadow (sky, drifting clouds, hills, a tappable sun,
   Poussin the chick and floating picture bubbles). Deliberately single-theme, colors set explicitly. */
:root {
  --ol-c: #1F2B4D;
  --sky-top: #7CC8FF;
  --sky-bottom: #DDF3FF;
  --hill-back: #9BE07A;
  --hill-front: #5CC26B;
  --ink: #1F2B4D;
  --ink-soft: #5A6890;
  --card: #FFFFFF;
  --sun: #FFC93C;
  --berry: #FF5D73;
  --leaf: #34C27A;
  --sea: #3A86FF;
  --shadow: 0 6px 0 rgba(31,43,77,.14);
  --display: "Baloo 2", "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 70%) fixed, var(--sky-bottom);
  color: var(--ink); font-family: var(--display); font-size: 18px;
  overflow-x: hidden; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sky-top); }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 4px solid var(--sea); outline-offset: 3px; }
img { -webkit-user-drag: none; }
/* dark outline so white text never disappears on the sky */
.ol {
  color: #fff !important;
  text-shadow: 2px 0 0 var(--ol-c), -2px 0 0 var(--ol-c), 0 2px 0 var(--ol-c), 0 -2px 0 var(--ol-c),
               1.5px 1.5px 0 var(--ol-c), -1.5px -1.5px 0 var(--ol-c), 1.5px -1.5px 0 var(--ol-c), -1.5px 1.5px 0 var(--ol-c),
               0 4px 0 var(--ol-c) !important;
}

/* ---------- Loader: an egg wobbles, then Poussin hatches ---------- */
.loader { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; align-content: center; gap: 22px;
  background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom)); transition: opacity .45s; }
.loader.out { opacity: 0; pointer-events: none; }
.loader .eggbox { position: relative; width: 150px; height: 150px; }
.loader .eggbox img { position: absolute; inset: 0; width: 100%; height: 100%; }
.loader .egg { animation: eggwob 1.1s ease-in-out infinite; transform-origin: 50% 90%; }
.loader .hatch { opacity: 0; transform: scale(.3); }
.loader.hatched .egg { animation: eggpop .35s ease-in forwards; }
.loader.hatched .hatch { animation: hatchpop .55s .2s cubic-bezier(.3,1.6,.5,1) forwards; }
.loader .shadow { position: absolute; left: 30px; right: 30px; bottom: -8px; height: 14px; border-radius: 50%; background: rgba(31,43,77,.15); animation: shad 1.1s ease-in-out infinite; }
@keyframes eggwob { 0%,100% { transform: rotate(0) } 15% { transform: rotate(-12deg) } 30% { transform: rotate(10deg) } 45% { transform: rotate(-6deg) } 60% { transform: rotate(0) translateY(-14px) } 75% { transform: rotate(0) } }
@keyframes eggpop { to { transform: scale(1.3); opacity: 0; } }
@keyframes hatchpop { to { opacity: 1; transform: scale(1); } }
@keyframes shad { 60% { transform: scaleX(.8); opacity: .6; } }
.ldots { display: flex; gap: 12px; }
.ldots i { width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 3px 0 rgba(31,43,77,.2); animation: ldot 1s ease-in-out infinite; }
.ldots i:nth-child(2) { animation-delay: .15s; background: var(--sun); }
.ldots i:nth-child(3) { animation-delay: .3s; background: var(--leaf); }
@keyframes ldot { 0%,100% { transform: translateY(0) } 40% { transform: translateY(-16px) } }
.blob { display: inline-block; width: clamp(110px, 30vw, 170px); aspect-ratio: 1; border-radius: 48% 52% 44% 56% / 55% 45% 55% 45%; background: var(--c); border: 5px solid rgba(31,43,77,.12);
  box-shadow: inset -10px -14px 0 rgba(0,0,0,.12), inset 10px 10px 0 rgba(255,255,255,.35); }
.big .blob { width: clamp(180px, 55vw, 260px); }
.tile .blob, .row h2 .blob { width: 92px; }
.row h2 .blob { width: 44px; border-width: 3px; }

/* ---------- Living background ---------- */
.scene { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.cloud { position: absolute; left: -200px; opacity: .95; animation: drift linear infinite; }
.cloud.c1 { top: 8%; width: 150px; animation-duration: 70s; }
.cloud.c2 { top: 26%; width: 110px; animation-duration: 95s; animation-delay: -40s; opacity: .8; }
.cloud.c3 { top: 46%; width: 90px; animation-duration: 120s; animation-delay: -80s; opacity: .7; }
@keyframes drift { from { transform: translateX(0); } to { transform: translateX(calc(100vw + 400px)); } }
.hills { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 150px; }
.hills .back { fill: var(--hill-back); }
.hills .front { fill: var(--hill-front); }
.flower { position: absolute; bottom: 18px; width: 46px; animation: sway 3s ease-in-out infinite alternate; transform-origin: bottom center; }
.flower.f1 { right: 22%; } .flower.f2 { right: 8%; bottom: 40px; width: 38px; animation-delay: -1.5s; } .flower.f3 { left: 42%; bottom: 10px; width: 40px; animation-delay: -.7s; }
@keyframes sway { from { transform: rotate(-6deg); } to { transform: rotate(6deg); } }

.sunbtn { position: fixed; z-index: 2; top: calc(env(safe-area-inset-top, 0px) + 70px); right: max(10px, env(safe-area-inset-right, 0px)); width: 92px; height: 92px; opacity: .95; }
.sunbtn img { width: 100%; height: 100%; animation: spin 30s linear infinite; }
.sunbtn.happy img { animation: spinfast .9s ease-out; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes spinfast { from { transform: rotate(0) scale(1.2); } to { transform: rotate(720deg) scale(1); } }

.chick { position: fixed; z-index: 6; left: max(10px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); width: 96px; height: 96px; }
.chick img { width: 100%; height: 100%; animation: idle 2.4s ease-in-out infinite; transform-origin: bottom center; }
.chick.hop img { animation: chickhop .7s ease-out; }
@keyframes idle { 0%,100% { transform: scale(1, 1); } 50% { transform: scale(1.04, .96); } }
@keyframes chickhop { 0% { transform: translateY(0) } 30% { transform: translateY(-50px) rotate(-12deg) } 60% { transform: translateY(0) scale(1.1,.9) } 100% { transform: none } }
.say {
  position: fixed; z-index: 7; left: calc(max(10px, env(safe-area-inset-left, 0px)) + 86px); bottom: calc(env(safe-area-inset-bottom, 0px) + 80px);
  max-width: min(260px, 60vw); padding: 10px 14px; border-radius: 20px 20px 20px 4px; background: var(--card);
  font-weight: 800; font-size: 1.1rem; box-shadow: var(--shadow); animation: popin .25s ease-out;
}
@keyframes popin { from { transform: scale(.4); opacity: 0; } }


/* ---------- App ---------- */
.app {
  position: relative; z-index: 3; pointer-events: none;
  min-height: 100%; display: flex; flex-direction: column; box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 130px; max-width: 1040px; margin: 0 auto;
}
.app button, .app select, .app .panel { pointer-events: auto; }

.bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; color: #fff; text-shadow: 0 2px 0 rgba(31,43,77,.25); }
.brand .logo { width: 48px; height: 48px; border-radius: 16px; background: var(--sun); display: grid; place-items: center; box-shadow: var(--shadow); }
.brand .logo img { width: 36px; height: 36px; }
.brand b { font-size: 1.5rem; font-weight: 800; line-height: 1; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; background: var(--card); font-size: .9rem; font-weight: 700; box-shadow: 0 3px 0 rgba(31,43,77,.12); }
.chip img { width: 22px; height: 22px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--card); }
.stars { background: var(--sun); }
.notice { margin-top: 10px; padding: 10px 14px; border-radius: 14px; background: #FFF1C7; font-size: .9rem; font-weight: 500; pointer-events: auto; }

.screen { flex: 1; display: flex; flex-direction: column; gap: 18px; margin-top: 18px; }
.back { flex: none; width: 60px; height: 60px; border-radius: 20px; background: var(--card); font-size: 30px; font-weight: 800; box-shadow: var(--shadow); display: grid; place-items: center; }
.row { display: flex; align-items: center; gap: 14px; }
.row h2 { margin: 0; font-size: 1.8rem; font-weight: 800; line-height: 1.1; text-wrap: balance; display: flex; align-items: center; gap: 10px; color: #fff; text-shadow: 0 2px 0 rgba(31,43,77,.3); }
.row h2 img { width: 48px; height: 48px; filter: drop-shadow(0 3px 0 rgba(31,43,77,.15)); }

.hello { align-self: flex-start; display: flex; align-items: center; gap: 12px; font-size: 2.3rem; font-weight: 800; line-height: 1.05; text-align: left; color: #fff; text-shadow: 0 3px 0 rgba(31,43,77,.28); }
.hello img { width: 64px; height: 64px; }
.hello small { display: block; font-size: 1rem; font-weight: 700; }
.group-title { margin: 6px 0 -4px; font-size: .85rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink); font-weight: 800; opacity: .7; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
.tile {
  border-radius: 28px; padding: 16px 10px 12px; background: var(--card); box-shadow: var(--shadow);
  display: flex; flex-direction: column; align-items: center; gap: 4px; transition: transform .15s;
}
.tile:hover img { transform: rotate(-6deg) scale(1.06); }
.tile img { width: 84px; height: 84px; transition: transform .2s; }
.tile img.cv { width: 104px; height: 104px; border-radius: 26px; object-fit: cover; border: 4px solid #fff; box-shadow: 0 6px 14px rgba(31,43,77,.16); background: #fff; }
.row h2 img.cv { border-radius: 14px; object-fit: cover; border: 3px solid #fff; filter: none; box-shadow: 0 3px 8px rgba(31,43,77,.18); }
.tile:active { transform: scale(.95) translateY(3px); box-shadow: 0 2px 0 rgba(31,43,77,.12); }
.tile .fr { font-size: 1.2rem; font-weight: 800; line-height: 1.15; text-align: center; }
.tile .n { font-size: .8rem; color: var(--ink-soft); font-weight: 500; }

.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; flex: 1; align-content: center; }
.mode { border-radius: 36px; padding: 28px 16px; color: #fff; box-shadow: 0 8px 0 rgba(31,43,77,.2); display: flex; flex-direction: column; align-items: center; gap: 8px; }
.mode img { width: 140px; height: 140px; animation: idle 2.4s ease-in-out infinite; }
.mode b { font-size: 2rem; font-weight: 800; }
.mode.look { background: var(--sea); }
.mode.play { background: var(--leaf); }
.mode:active { transform: translateY(4px); box-shadow: 0 4px 0 rgba(31,43,77,.2); }

.learn { flex: 1; display: grid; grid-template-columns: 72px 1fr 72px; align-items: center; gap: 12px; }
.arrow { width: 72px; height: 72px; border-radius: 50%; background: var(--sun); font-size: 32px; font-weight: 800; box-shadow: var(--shadow); display: grid; place-items: center; }
.arrow img { width: 44px; height: 44px; }
.arrow:disabled { opacity: .35; }
.big {
  border-radius: 40px; background: var(--card); box-shadow: 0 10px 0 rgba(31,43,77,.14);
  min-height: 360px; padding: 24px 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-width: 0;
}
.big .pic img.main { width: clamp(150px, 34vw, 240px); height: auto; aspect-ratio: 1; max-width: 100%; filter: drop-shadow(0 10px 10px rgba(31,43,77,.12)); }
.big .word { font-size: clamp(1.9rem, 6.5vw, 3.2rem); font-weight: 800; line-height: 1.05; text-align: center; overflow-wrap: anywhere; text-wrap: balance; }
.big .hint { font-size: .9rem; color: var(--ink-soft); display: flex; align-items: center; gap: 6px; }
.big .hint img { width: 22px; height: 22px; }
.dots { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.dots i { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,.7); }
.dots i.on { background: var(--sea); transform: scale(1.3); }

.num { display: grid; place-items: center; gap: 6px; }
.num .digit { font-size: clamp(3rem, 10vw, 5rem); font-weight: 800; color: var(--sea); line-height: .9; }
.num .apples { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; max-width: 260px; }
.num .apples img { width: 46px; height: 46px; }
.opt .num .digit { font-size: clamp(2rem, 7vw, 3.4rem); }
.opt .num .apples { max-width: 190px; }
.opt .num .apples img { width: 30px; height: 30px; }

.ask { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 26px; background: var(--card); box-shadow: var(--shadow); flex-wrap: wrap; }
.ask .speaker { width: 68px; height: 68px; flex: none; border-radius: 50%; background: var(--berry); display: grid; place-items: center; box-shadow: 0 5px 0 rgba(31,43,77,.18); }
.ask .speaker img { width: 42px; height: 42px; }
.ask .speaker.pulse { animation: pulse 1s ease-in-out 2; }
.ask .q { font-size: 1.6rem; font-weight: 800; line-height: 1.1; min-width: 0; flex: 1 1 180px; overflow-wrap: anywhere; }
.progress { display: flex; gap: 4px; flex: none; }
.progress img { width: 28px; height: 28px; opacity: .25; filter: grayscale(1); }
.progress img.on { opacity: 1; filter: none; }
.opts { display: grid; gap: 16px; grid-template-columns: repeat(2, 1fr); flex: 1; align-content: center; }
.opts.three { grid-template-columns: repeat(3, 1fr); }
.opt {
  border-radius: 34px; background: var(--card); box-shadow: 0 8px 0 rgba(31,43,77,.14); min-height: 210px;
  display: grid; place-items: center; border: 5px solid transparent; padding: 12px; min-width: 0;
}
.opt img.main { width: clamp(100px, 22vw, 170px); height: auto; aspect-ratio: 1; max-width: 100%; }
.opt.right { border-color: var(--leaf); background: #E3FAEE; animation: hop .5s; }
.opt.wrong { animation: wiggle .45s; }
.opt.fade { opacity: .35; }

.move-card { flex: 1; min-height: 280px; }
img.main.photo { border-radius: 24px; background: #fff; filter: none; box-shadow: 0 8px 22px rgba(31,43,77,.16); border: 4px solid #fff; }
.big .pic img.main.photo { width: clamp(220px, 72vw, 380px); }
.opt img.main.photo { width: clamp(118px, 38vw, 220px); border-radius: 18px; }
.move-card img.main { animation: idle 1.6s ease-in-out infinite; }
.done-btn { align-self: center; padding: 16px 44px; }
.done-btn img { width: 56px; height: 56px; }
.win { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; }
.win .trophy { width: 170px; height: 170px; animation: hop 1s ease-in-out infinite alternate; }
.win h2 { margin: 0; font-size: 3rem; font-weight: 800; color: #fff; text-shadow: 0 3px 0 rgba(31,43,77,.3); }
.win .got { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.win .got img { width: 52px; height: 52px; }
.win .actions { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.btn { padding: 14px 24px; border-radius: 22px; font-size: 1.4rem; font-weight: 800; box-shadow: var(--shadow); background: var(--card); display: inline-flex; align-items: center; gap: 10px; }
.btn img { width: 48px; height: 48px; }
.btn.go { background: var(--leaf); color: #fff; }

.panel { margin-top: 12px; padding: 16px; border-radius: 20px; background: var(--card); box-shadow: var(--shadow); display: grid; gap: 12px; font-size: .95rem; }
.panel h3 { margin: 0; font-size: 1.1rem; }
.panel label { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.panel p { margin: 0; color: var(--ink-soft); line-height: 1.45; max-width: 65ch; }
.seg { display: inline-flex; background: #E6F3FF; border-radius: 12px; padding: 3px; }
.seg button { padding: 6px 12px; border-radius: 10px; font-weight: 700; font-size: .9rem; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--card); }

.rain { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 21; }
.rain > * { position: absolute; top: -60px; animation: fall linear forwards; }
.rain i { width: 12px; height: 18px; border-radius: 3px; }
.rain img { width: 38px; height: 38px; }
@keyframes fall { to { transform: translateY(calc(100vh + 120px)) rotate(var(--r)); } }
body.flash .app { animation: flashy .6s ease-out; }
@keyframes flashy { 0% { filter: brightness(1); transform: scale(1); } 30% { filter: brightness(1.25) saturate(1.3); transform: scale(1.02); } 100% { filter: none; transform: none; } }
.chick.dance img { animation: dance .45s ease-in-out 5; }
@keyframes dance { 0%,100% { transform: rotate(0) } 25% { transform: rotate(-16deg) translateY(-12px) scale(1.1) } 75% { transform: rotate(16deg) translateY(-12px) scale(1.1) } }
.chick.bounce img { animation: wiggle .45s; }
.tile.bounce, .bounce { animation: hop .45s; }
.burst { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
.burst img { position: absolute; width: 40px; height: 40px; animation: fly 1.1s ease-out forwards; }

.bounce { animation: hop .45s; }
@keyframes hop { 0%{transform:scale(1)} 40%{transform:scale(1.1) translateY(-10px)} 100%{transform:scale(1)} }
@keyframes wiggle { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-12px) rotate(-3deg)} 75%{transform:translateX(12px) rotate(3deg)} }
@keyframes pulse { 50%{ transform: scale(1.15); } }
@keyframes fly { to { transform: translate(var(--x), var(--y)) rotate(var(--r)); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

@media (max-width: 560px) {
  .learn { grid-template-columns: 1fr 1fr; }
  .learn .big { grid-column: 1 / -1; grid-row: 1; min-height: 320px; }
  .learn .arrow { justify-self: center; }
  .opts.three { grid-template-columns: repeat(2, 1fr); }
  .opts.three .opt:nth-child(3) { grid-column: 1 / -1; }
  .opt { min-height: 160px; }
  .hello { font-size: 1.8rem; }
  .grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .tile img { width: 72px; height: 72px; }
  .sunbtn { width: 64px; height: 64px; top: calc(env(safe-area-inset-top, 0px) + 64px); }
  .chick { width: 80px; height: 80px; }
}
</style>

<div class="loader" id="loader">
  <div class="eggbox"><span class="shadow"></span><img class="egg" src="img/egg.png" alt=""><img class="hatch" src="img/hatching-chick.png" alt=""></div>
  <div class="ldots"><i></i><i></i><i></i></div>
</div>

<div class="scene" aria-hidden="true">
  <img class="cloud c1" src="img/cloud.png" alt="">
  <img class="cloud c2" src="img/cloud.png" alt="">
  <img class="cloud c3" src="img/cloud.png" alt="">
  <svg class="hills" viewBox="0 0 1200 150" preserveAspectRatio="none">
    <path class="back" d="M0 80 C 180 20, 360 30, 520 70 S 860 120, 1200 40 L1200 150 L0 150 Z"/>
    <path class="front" d="M0 120 C 220 70, 420 80, 640 110 S 1000 140, 1200 95 L1200 150 L0 150 Z"/>
  </svg>
  <img class="flower f1" src="img/tulip.png" alt="">
  <img class="flower f2" src="img/sunflower.png" alt="">
  <img class="flower f3" src="img/blossom.png" alt="">
</div>
<button type="button" class="sunbtn" id="sun" aria-label="Le soleil"><img src="img/sun-with-face.png" alt=""></button>
<button type="button" class="chick" id="chick" aria-label="Poussin"><img src="img/baby-chick.png" alt=""></button>
<div class="say" id="say" hidden></div>

<div class="app" id="app">
  <header class="bar">
    <div class="brand">
      <div class="logo"><img src="img/hatching-chick.png" alt=""></div>
      <b class="ol">Petit Français</b>
    </div>
    <button class="chip stars" id="starChip" type="button" aria-label="Stars earned"><img src="img/star.png" alt=""><span id="starCount">0</span></button>
    <button class="chip" id="parentBtn" type="button" aria-pressed="false" aria-expanded="false" aria-controls="panel">Parents</button>
  </header>

  <div class="notice" id="notice" hidden></div>

  <section class="panel" id="panel" hidden>
    <h3>Parent settings</h3>
    <label>Speaking speed
      <span class="seg" id="speedSeg"><button type="button" data-v="0.8">Slow</button><button type="button" data-v="1">Normal</button></span>
    </label>
    <label>Pictures per question in games
      <span class="seg" id="optSeg"><button type="button" data-v="2">2</button><button type="button" data-v="3">3</button><button type="button" data-v="4">4</button></span>
    </label>
    <label>Show the written word
      <span class="seg" id="wordSeg"><button type="button" data-v="1">Show</button><button type="button" data-v="0">Hide</button></span>
    </label>
    <p>Five minutes a day is plenty. Let him tap the picture, hear it, and say it back out loud. Start with “Je dis” and “La maîtresse dit”. The games remember what he got right or wrong: they never ask the same thing twice in a row, and mistakes come back a bit later.</p>
  </section>

  <main class="screen" id="screen"></main>
</div>

<script>
(function () {
  // ---------- Content ----------
  // Each item: [French text, fallback emoji, drawing]. Colours: [text, hex]. Numbers: [text, count].
  // Every phrase is read by the same young voice; everything else is sound effects and animation.

      '<div class="modes">' +
      '<button type="button" class="mode look" id="look" aria-label="Regarde">' + img("Eyes") + "</button>" +
      '<button type="button" class="mode play" id="play" aria-label="Joue">' + img("Video game") + "</button></div>";
    document.getElementById("back").onclick = () => go("home");
    document.getElementById("look").onclick = () => { sfx("whoosh"); go("learn", { cat: state.cat, idx: 0 }); sayCurrent(); };
    document.getElementById("play").onclick = () => { sfx("drum"); startGame(state.cat); };
  }

  const sayCurrent = () => { const c = CATS[state.cat]; ready.then(() => say(c.items[state.idx][0])); };

  function renderLearn() {
    const cat = CATS[state.cat], item = cat.items[state.idx], n = cat.items.length;
    $screen.innerHTML = header(cat) +
      '<div class="learn">' +
      '<button type="button" class="arrow" id="prev" aria-label="Précédent"' + (state.idx === 0 ? " disabled" : "") + ">◀</button>" +
      '<button type="button" class="big" id="card" aria-label="' + esc(item[0]) + '"><span class="pic">' + picHTML(cat, item) + "</span>" +
      (prefs.word ? '<span class="word">' + esc(item[0]) + "</span>" : "") +
      '<span class="hint">' + img("Speaker high volume") + "</span></button>" +
      '<button type="button" class="arrow" id="next" aria-label="Suivant">' + (state.idx === n - 1 ? img("Video game") : "▶") + "</button></div>" +
      '<div class="dots">' + cat.items.map((_, i) => '<i class="' + (i === state.idx ? "on" : "") + '"></i>').join("") + "</div>";
    document.getElementById("back").onclick = () => go("cat", { cat: state.cat });
    const card = document.getElementById("card");
    card.onclick = () => { bounce(card); sfx("pop"); sayCurrent(); };
    document.getElementById("prev").onclick = () => { if (state.idx > 0) { state.idx--; render(); sayCurrent(); } };
    document.getElementById("next").onclick = () => {
      if (state.idx < n - 1) { state.idx++; render(); sayCurrent(); }
      else { sfx("drum"); rain(20); startGame(state.cat); }
    };
  }

  // ----- Game: hear a phrase, tap its picture -----
  function startGame(ci, queued) {
    state = { view: "game", cat: ci, total: ROUNDS, r: 0, score: 0, extra: 0, locked: false, asked: {}, wrong: {}, fixed: {} };
    window.scrollTo(0, 0);
    ready.then(() => setupRound(queued));
  }
  function setupRound(queued) {
    const cat = CATS[state.cat];
    const target = state.target = pickTarget(cat, state);
    state.firstTry = true;
    const key = i => picKey(cat.items[i]);   // never offer two items that share a picture
    const want = state.wrong[cat.items[target][0]] ? 2 : Math.min(prefs.opts, cat.items.length);   // easier after a mistake
    const others = [];
    for (const i of shuffle(cat.items.map((_, i) => i))) {
      if (others.length >= want - 1) break;
      if (i !== target && key(i) !== key(target) && !others.some(o => key(o) === key(i))) others.push(i);
    }
    state.options = shuffle([target].concat(others));
    state.locked = false;
    render();
    askNow(queued);
  }
  function askNow(queued) {
    const cat = CATS[state.cat], item = cat.items[state.target];
    const sp = document.getElementById("speaker"); if (sp) { sp.classList.remove("pulse"); void sp.offsetWidth; sp.classList.add("pulse"); }
    say(askText(cat, item[0]), { queue: !!queued });
  }
  function renderGame() {
    const cat = CATS[state.cat], item = cat.items[state.target];
    $screen.innerHTML = header(cat) +
      '<div class="ask"><button type="button" class="speaker" id="speaker" aria-label="Écouter">' + img("Speaker high volume") + "</button>" +
      '<div class="q">' + (prefs.word ? esc(askText(cat, item[0])) : "") + "</div>" +
      '<div class="progress" aria-label="Étoiles">' + stars(state) + "</div></div>" +
      '<div class="opts' + (state.options.length === 3 ? " three" : "") + '">' +
      state.options.map(i => '<button type="button" class="opt" data-i="' + i + '" aria-label="' + esc(cat.items[i][0]) + '">' + picHTML(cat, cat.items[i]) + "</button>").join("") +
      "</div>";
    document.getElementById("back").onclick = () => go(state.cat === CATS.findIndex(c => c.id === ALL_ID) ? "home" : "cat", { cat: state.cat });
    document.getElementById("speaker").onclick = () => askNow();
    $screen.querySelectorAll(".opt").forEach(b => b.onclick = () => choose(b));
  }
  async function choose(btn) {
    if (state.locked) return;
    const cat = CATS[state.cat], target = state.target, i = +btn.dataset.i, t = cat.items[target][0];
    if (i === target) {
      state.locked = true;
      btn.classList.add("right"); sfx("yay");
      $screen.querySelectorAll(".opt").forEach(b => { if (b !== btn) b.classList.add("fade"); });
      record(t, state.firstTry);
      if (state.wrong[t] && state.firstTry) state.fixed[t] = true;   // only counts when asked again later
      state.asked[t] = (state.asked[t] || 0) + 1;
      state.score = Math.min(state.score + 1, state.total);
      const prog = $screen.querySelectorAll(".progress img"); if (prog[state.score - 1]) prog[state.score - 1].classList.add("on");
      party(btn);
      await say(t);   // hear the phrase once more with the right picture
      setTimeout(() => {
        if (state.view !== "game") return;
        state.r++;
        if (state.r >= state.total) {
          // a phrase he missed and hasn't got right since comes back once more before the end
          const pending = Object.keys(state.wrong).some(w => !state.fixed[w]);
          if (pending && state.extra < 2) { state.extra++; state.total++; return setupRound(); }
          addStars(state.score); go("win", { cat: state.cat, score: state.score });
        } else setupRound();
      }, 400);
    } else {
      // lock while the hint plays so fast repeated taps don't pile up audio
      state.locked = true;
      if (state.firstTry) { state.firstTry = false; state.wrong[t] = true; }
      const round = state.r;
      btn.classList.remove("wrong"); void btn.offsetWidth; btn.classList.add("wrong");
      sfx("bwomp"); bounce(chick);
      setTimeout(() => { say(askText(cat, t)); if (state.view === "game" && state.r === round) state.locked = false; }, 700);
    }
  }

  function renderWin() {
    $screen.innerHTML =
      '<div class="win">' + img("Trophy", "trophy") + '<h2 class="ol">Bravo !</h2>' +
      '<div class="got">' + Array.from({ length: state.score }, () => img("Star")).join("") + "</div>" +
      '<div class="actions"><button type="button" class="btn go" id="again" aria-label="Encore">' + img("Counterclockwise arrows button") + '</button><button type="button" class="btn" id="home" aria-label="Maison">' + img("House") + "</button></div></div>";
    sfx("tada"); dance(); flash();
    burst(null, null, null, 40); rain(50);
    setTimeout(() => { burst(null, null, null, 40); sfx("yay"); }, 900);
    setTimeout(() => { rain(50); sfx("pop"); }, 1600);
    setTimeout(() => { burst(null, null, null, 40); sfx("tada"); }, 2400);
    document.getElementById("again").onclick = () => state.move ? startMove(state.cat) : startGame(state.cat);
    document.getElementById("home").onclick = () => go("home");
  }

  // ---------- Parent panel ----------
  function setSeg(id, val) { document.querySelectorAll("#" + id + " button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === String(val)))); }
  function bindSeg(id, key) {
    setSeg(id, prefs[key]);
    document.querySelectorAll("#" + id + " button").forEach(b => b.onclick = () => {
      prefs[key] = Number(b.dataset.v); store.set(key, prefs[key]); setSeg(id, prefs[key]);
      if (key === "speed") say("Bonjour !");
      if (key === "word" && state.view !== "home") render();
    });
  }
  bindSeg("speedSeg", "speed"); bindSeg("optSeg", "opts"); bindSeg("wordSeg", "word");
  const pBtn = document.getElementById("parentBtn"), panel = document.getElementById("panel");
  pBtn.onclick = () => { const open = panel.hidden; panel.hidden = !open; pBtn.setAttribute("aria-pressed", String(open)); pBtn.setAttribute("aria-expanded", String(open)); };
  document.getElementById("starChip").onclick = e => { sfx("ding"); dance(); const r = e.currentTarget.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2, ["Star", "Glowing star"], 16); };

  document.getElementById("starCount").textContent = prefs.stars;
  render();
  // the egg wobbles until the voices are loaded, then Poussin hatches
  const loader = document.getElementById("loader"), t0 = Date.now();
  ready.then(() => new Promise(r => setTimeout(r, Math.max(0, 1300 - (Date.now() - t0))))).then(() => {
    loader.classList.add("hatched");
    setTimeout(() => loader.classList.add("out"), 900);
    setTimeout(() => loader.remove(), 1500);
  });
})();
</script>
